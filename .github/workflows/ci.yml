name: ci

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      desktop: ${{ steps.changes.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed files
        id: changes
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: python3 -m tools.ci.changes --base "origin/$BASE_REF"

  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          enable_kvm: false
      - name: Run checks
        run: nix develop -c just check

  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Evaluate flake
        run: nix flake check --no-build

  e2e:
    needs: changes
    if: needs.changes.outputs.desktop == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: ${{ vars.E2E_SOFT != 'false' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          enable_kvm: true
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - name: Check KVM
        run: test -w /dev/kvm
      - name: Build test driver
        run: nix build -L .#checks.x86_64-linux.desktop-e2e.driver
      - name: Run VM test
        id: e2e
        run: mkdir -p out && ./result/bin/nixos-test-driver -o out
      - name: Check screenshots
        run: nix develop -c just visual
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-out
          path: out/

  pr-rules:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Check PR link rules
        run: python3 -m tools.gh.events pr-rules
      - name: Warn on stale docs
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 -m tools.docs stale --pr "$PR_NUMBER" --mode warn

  gate:
    needs: [changes, fast, eval, e2e, pr-rules]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      # PR head on purpose: gate holds no secrets, and it must test its own changes (#6).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide
        env:
          NEEDS: ${{ toJSON(needs) }}
          E2E_SOFT: ${{ vars.E2E_SOFT }}
        run: python3 -m tools.ci.gate
