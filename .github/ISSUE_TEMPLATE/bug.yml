name: Bug
description: Something does not work as expected
labels:
  - bug
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - shell
        - desktop
        - host
        - harness
        - docs
        - agents
        - repo
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
    validations:
      required: true
